# Local development stack. `make up` starts it; only Caddy is published, on 127.0.0.1.
# Use it through `make`: .env carries UID/GID so containers write files as your user.
name: tabularius

x-php: &php
  build:
    context: ./infra/php
    target: dev
  image: tabularius-php-dev
  user: "${UID:-1000}:${GID:-1000}"
  environment: &php-env
    COMPOSER_HOME: /tmp/composer
    COMPOSER_CACHE_DIR: /cache/composer
  depends_on:
    db:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./api/public:/app/public:ro
      - ./business/public:/business/public:ro
    depends_on: [api, business, client, mailpit]

  api:
    <<: *php
    volumes:
      - ./api:/app
      - ./.cache/composer:/cache/composer
    environment: &api-env
      <<: *php-env
      APP_SECRET: ${API_APP_SECRET}
      DATABASE_URL: postgresql://tabularius_app:${TABULARIUS_APP_PASSWORD}@db:5432/tabularius?serverVersion=18&charset=utf8
      MIGRATIONS_DATABASE_URL: postgresql://tabularius_migrator:${TABULARIUS_MIGRATOR_PASSWORD}@db:5432/tabularius?serverVersion=18&charset=utf8
      BUSINESS_API_URL: http://caddy:8081
      BUSINESS_API_TOKEN: ${BUSINESS_API_TOKEN}
      APP_MODE: demo
      DEMO_SHARED_PASSWORD: ${DEMO_SHARED_PASSWORD}
      PUBLIC_BASE_URL: http://127.0.0.1:8080
      MAILER_FROM: tabularius@gitpush.app
      # Local: every e-mail lands in Mailpit (http://127.0.0.1:8025), nothing is delivered.
      MAILER_DSN: smtp://mailpit:1025
      MAILER_CAPTURE_DSN: smtp://mailpit:1025

  # Background jobs (report execution). Restarts hourly to pick up code changes and release memory.
  worker:
    <<: *php
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_mail", "--time-limit=3600", "--memory-limit=128M", "-v"]
    restart: unless-stopped
    volumes:
      - ./api:/app
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  business:
    <<: *php
    volumes:
      - ./business:/app
      - ./.cache/composer:/cache/composer
    environment:
      <<: *php-env
      APP_SECRET: ${BUSINESS_APP_SECRET}
      DATABASE_URL: postgresql://business_reader:${BUSINESS_READER_PASSWORD}@db:5432/business?serverVersion=18&charset=utf8
      MIGRATIONS_DATABASE_URL: postgresql://business_owner:${BUSINESS_OWNER_PASSWORD}@db:5432/business?serverVersion=18&charset=utf8
      BUSINESS_API_TOKEN: ${BUSINESS_API_TOKEN}
      BUSINESS_ALLOW_SEED: "1"

  client:
    image: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: npm run dev
    environment:
      npm_config_cache: /cache/npm
    volumes:
      - ./client:/app
      - ./.cache/npm:/cache/npm

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TABULARIUS_MIGRATOR_PASSWORD: ${TABULARIUS_MIGRATOR_PASSWORD}
      TABULARIUS_APP_PASSWORD: ${TABULARIUS_APP_PASSWORD}
      BUSINESS_OWNER_PASSWORD: ${BUSINESS_OWNER_PASSWORD}
      BUSINESS_READER_PASSWORD: ${BUSINESS_READER_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db:
