name: Deploy staging

# After CI succeeds on main (images published by the CI `publish` job), or manually for a commit on main.
# Secrets: STAGING_SSH_HOST, STAGING_SSH_KEY, STAGING_SSH_KNOWN_HOSTS, optional STAGING_MAILBOX_DSN, STAGING_MAILER_DSN.
# Variables: optional STAGING_MAIL_ALLOWED_RECIPIENTS (controlled test addresses before the public demo is approved),
# STAGING_MAIL_INGEST_SINCE (ISO 8601; older mail in the mailbox is never read), STAGING_OPENAI_MODEL.
# Optional secrets STAGING_SENTRY_DSN (error reporting) and STAGING_SENTRY_AUTH_TOKEN with variables SENTRY_ORG,
# SENTRY_PROJECT (release, source maps, deployment record; TASK-015).
# Optional secret STAGING_OPENAI_API_KEY: without it staging interprets with the rule-based baseline. Variables: STAGING_DOMAIN, optional
# STAGING_SSH_USER, STAGING_APP_DIR (docs/runbook.md, Staging). Until they exist the job stops with a notice.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main to deploy (also to go back to an earlier release)
        required: true

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.deployed.outputs.done }}
    # The token is handed to the server for one registry login, so it may only read.
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ vars.STAGING_SSH_USER || 'tabularius_deploy' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/srv/Tabularius' }}
    steps:
      - name: Configured?
        id: configured
        run: |
          if [[ -z "$DOMAIN" || -z "$SSH_HOST" ]]; then
            echo "::notice::staging is not configured yet (docs/runbook.md, Staging); nothing deployed"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ready == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Only commits on main are deployed; after CI, a commit that is no longer the head of main is skipped.
      - name: Check the commit is on main
        id: guard
        if: steps.configured.outputs.ready == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          if [[ "$EVENT" == workflow_run && "$(git rev-parse origin/main)" != "$SHA" ]]; then
            echo "::notice::main has moved on; skipping $SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # The runner script comes from main; the stack files from the deployed commit.
          cp infra/ci/deploy-remote.sh "$RUNNER_TEMP/"
          git checkout --quiet "$SHA"

      - name: Deploy, migrate, smoke-test
        if: steps.configured.outputs.ready == 'true' && steps.guard.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          MAILBOX_DSN: ${{ secrets.STAGING_MAILBOX_DSN }}
          MAILER_DSN: ${{ secrets.STAGING_MAILER_DSN }}
          MAIL_ALLOWED_RECIPIENTS: ${{ vars.STAGING_MAIL_ALLOWED_RECIPIENTS }}
          # 1 = demo replies to every sender (public demo, owner 2026-11-24); 0 or unset = test addresses only.
          MAIL_PUBLIC_REPLIES: ${{ vars.STAGING_MAIL_PUBLIC_REPLIES }}
          MAIL_INGEST_SINCE: ${{ vars.STAGING_MAIL_INGEST_SINCE }}
          OPENAI_API_KEY: ${{ secrets.STAGING_OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.STAGING_OPENAI_MODEL }}
          SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
          # true = public demo without the environment login (owner, 2026-11-24); anything else keeps staging private.
          STAGING_PUBLIC: ${{ vars.STAGING_PUBLIC }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: bash "$RUNNER_TEMP/deploy-remote.sh"

      - name: Mark deployed
        id: deployed
        if: steps.configured.outputs.ready == 'true' && steps.guard.outputs.skip != 'true'
        run: echo "done=true" >> "$GITHUB_OUTPUT"

  sentry:
    name: Sentry release
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Its own job: the Sentry token never reaches the server; the registry token only reads.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Release, source maps, deployment
        env:
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          ENV_NAME: staging
          SENTRY_AUTH_TOKEN: ${{ secrets.STAGING_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: bash infra/ci/sentry-release.sh
