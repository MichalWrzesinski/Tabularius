name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Required check: the same `make ci` that runs locally (Docker and make only).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache Composer and npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            api/vendor
            business/vendor
            client/node_modules
          key: deps-${{ hashFiles('api/composer.lock', 'business/composer.lock', 'client/package-lock.json', 'infra/php/Dockerfile') }}
      - name: make ci
        run: make ci
      - name: Build production images (artefact check)
        run: |
          docker build -f infra/php/Dockerfile --target prod -t api:ci api
          docker build -f infra/php/Dockerfile --target prod --build-arg HEALTH_PATH=/health -t business:ci business
          docker build -t client:ci client

  publish:
    # After merge to main: immutable images tagged with the commit (devops standard).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: api
            file: infra/php/Dockerfile
            args: ""
          - name: business
            context: business
            file: infra/php/Dockerfile
            args: HEALTH_PATH=/health
          - name: client
            context: client
            file: client/Dockerfile
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          build-args: ${{ matrix.args }}
          push: true
          tags: ghcr.io/michalwrzesinski/tabularius-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
