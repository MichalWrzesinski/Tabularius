# Two connections (ADR 0002): `default` = business_reader (API runtime, SELECT on reporting views only),
# `owner` = business_owner (migrations and seed). No ORM: reads are explicit SQL against views.
doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                server_version: '18'
                profiling_collect_backtrace: '%kernel.debug%'
            owner:
                url: '%env(resolve:MIGRATIONS_DATABASE_URL)%'
                server_version: '18'

when@test:
    doctrine:
        dbal:
            connections:
                default:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                owner:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
