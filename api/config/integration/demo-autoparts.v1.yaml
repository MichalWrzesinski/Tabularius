# Integration profile (RPT-PROF-1): the single source for the operation catalog, parameter schemas, CSV columns,
# permitted fields and mapping to the business system. No addresses, credentials, SQL or expressions here
# (RPT-PROF-2): the adapter's URL and token come from the environment. Changed only by a trusted operator.
id: demo-autoparts
version: 1
organization: Hurtownia części samochodowych (dane fikcyjne)
currency: PLN
timezone: Europe/Warsaw
adapter: rest-json

operations:
  sales_report:
    label: Raport sprzedaży
    description: Sprzedaż netto po korektach, bez dokumentów anulowanych, dla klientów z zakresu pracownika.
    parameters:
      period: { type: period, required: true }
      customers: { type: customer_scope, required: true, default: all_assigned }
      manufacturer: { type: manufacturer, required: false }
      category: { type: category, required: false }
    columns: [typ_wiersza, data, dokument, rodzaj, klient_kod, klient, nr_czesci, producent, kategoria, ilosc, netto_pln]
    file_name: sprzedaz

  parts_catalog:
    label: Katalog części producenta
    description: Aktywne części jednoznacznie wskazanego producenta, tylko pola dozwolone w profilu.
    parameters:
      manufacturer: { type: manufacturer, required: true }
    # Permitted catalog fields (RPT-CAT-1); purchase price, supplier and margin are never exposed.
    permitted_fields: [manufacturerName, partNumber, name, category, unit, listPriceNet]
    columns: [typ_wiersza, producent, nr_czesci, nazwa, kategoria, jm, cena_katalogowa_netto_pln]
    file_name: katalog

  customer_discount_simulation:
    label: Aktywność klienta i symulacja rabatu
    description: Aktywność jednego klienta w okresie i symulacja rabatu według fikcyjnej polityki; oferta niezatwierdzona.
    parameters:
      customer: { type: customer, required: true }
      period: { type: period, required: true }
      policy: { type: discount_policy, required: false, default: current }
    columns: [typ_wiersza, pozycja, wartosc]
    file_name: symulacja_rabatu

categories: [Hamulce, Filtry, Zapłon, Oświetlenie, Zawieszenie, Wycieraczki, Sprzęgła, Łożyska]

limits:
  max_rows: 50000
  max_period_days: 366
