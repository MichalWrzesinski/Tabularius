# Server sessions in PostgreSQL (ADR 0003), JSON login, roles admin/rep. Blocked or deleted accounts are rejected
# on every request by AccountProvider::refreshUser; their session rows are also deleted (SessionRevoker).
security:
    password_hashers:
        App\Module\Identity\Account: 'auto'

    providers:
        accounts:
            id: App\Module\Identity\AccountProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)
            security: false
        api:
            pattern: ^/api
            lazy: true
            provider: accounts
            entry_point: App\Module\Identity\Http\ApiEntryPoint
            access_denied_handler: App\Module\Identity\Http\ApiEntryPoint
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Module\Identity\Http\LoginHandler
                failure_handler: App\Module\Identity\Http\LoginHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_logout
                invalidate_session: true

    access_control:
        - { path: ^/api/(health|ready)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/(login|password-reset|session)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/admin, roles: ROLE_ADMIN }
        - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Fast hashing in tests only; production uses `auto` (Argon2id/bcrypt).
            App\Module\Identity\Account:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
