framework:
    secret: '%env(APP_SECRET)%'
    session:
        handler_id: tabularius.session_handler
        name: tabularius_session
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 0
        gc_maxlifetime: 28800
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
