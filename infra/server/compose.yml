# Staging stack on the owner's shared VPS (docs/runbook.md). Images are the immutable ones CI publishes for a commit
# on main (IMAGE_TAG = commit SHA). The host's nginx terminates TLS and forwards to `edge` on 127.0.0.1:PROXY_PORT.
# Values come from $APP_DIR/.env (generated on the server by setup-shared-host.sh; never committed).
# Unique per project and environment (never the local stack's `tabularius`): own containers, volumes and network.
name: tabularius-staging

# Shared host: bounded logs and memory for every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api-env: &api-env
  APP_ENV: prod
  APP_SECRET: ${API_APP_SECRET:?}
  DATABASE_URL: postgresql://tabularius_app:${TABULARIUS_APP_PASSWORD:?}@db:5432/tabularius?serverVersion=18&charset=utf8
  MIGRATIONS_DATABASE_URL: postgresql://tabularius_migrator:${TABULARIUS_MIGRATOR_PASSWORD:?}@db:5432/tabularius?serverVersion=18&charset=utf8
  BUSINESS_API_URL: http://edge:8081
  BUSINESS_API_TOKEN: ${BUSINESS_API_TOKEN:?}
  APP_MODE: demo
  DEMO_SHARED_PASSWORD: ${DEMO_SHARED_PASSWORD:?}
  PUBLIC_BASE_URL: https://${DOMAIN:?}
  MAILER_FROM: ${MAILER_FROM:-tabularius@gitpush.app}
  # No real e-mail yet: in demo mode account mail goes to the capture transport, which drops it here.
  # Brevo is connected together with mail ingestion (increment 3) after the owner agrees the step.
  MAILER_DSN: ${MAILER_DSN:-null://null}
  MAILER_CAPTURE_DSN: null://null
  REPORT_STORAGE_DIR: /app/var/storage/reports
  # Real mailbox (imaps://…); empty until the owner supplies the IMAP details (TASK-006).
  MAILBOX_DSN: ${MAILBOX_DSN:-}
  REPORT_FILE_TTL_DAYS: "7"
  # Only the Docker gateway (the host's nginx) may set X-Forwarded-* (client IP for rate limits, HTTPS for cookies).
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:?}

services:
  db:
    logging: *logging
    mem_limit: 512m
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TABULARIUS_MIGRATOR_PASSWORD: ${TABULARIUS_MIGRATOR_PASSWORD:?}
      TABULARIUS_APP_PASSWORD: ${TABULARIUS_APP_PASSWORD:?}
      BUSINESS_OWNER_PASSWORD: ${BUSINESS_OWNER_PASSWORD:?}
      BUSINESS_READER_PASSWORD: ${BUSINESS_READER_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    logging: *logging
    mem_limit: 384m
    image: ghcr.io/michalwrzesinski/tabularius-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment: *api-env
    volumes:
      - reports:/app/var/storage/reports
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  worker:
    logging: *logging
    mem_limit: 256m
    image: ghcr.io/michalwrzesinski/tabularius-api:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_mail", "--time-limit=3600", "--memory-limit=128M"]
    environment: *api-env
    volumes:
      - reports:/app/var/storage/reports
    networks: [internal]
    # The image's healthcheck probes PHP-FPM, which the worker does not run.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f messenger:consume >/dev/null"]
      interval: 15s
    depends_on:
      db:
        condition: service_healthy

  # Retention (ACC-FILE-1): deletes expired report files once a day.
  purge:
    logging: *logging
    mem_limit: 128m
    image: ghcr.io/michalwrzesinski/tabularius-api:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php bin/console app:files:purge --no-interaction; php bin/console app:mail:purge --no-interaction; php bin/console app:tickets:expire --no-interaction; sleep 86400; done"]
    environment: *api-env
    volumes:
      - reports:/app/var/storage/reports
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
    depends_on:
      db:
        condition: service_healthy

  business:
    logging: *logging
    mem_limit: 256m
    image: ghcr.io/michalwrzesinski/tabularius-business:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${BUSINESS_APP_SECRET:?}
      DATABASE_URL: postgresql://business_reader:${BUSINESS_READER_PASSWORD:?}@db:5432/business?serverVersion=18&charset=utf8
      MIGRATIONS_DATABASE_URL: postgresql://business_owner:${BUSINESS_OWNER_PASSWORD:?}@db:5432/business?serverVersion=18&charset=utf8
      BUSINESS_API_TOKEN: ${BUSINESS_API_TOKEN:?}
      # Synthetic demo data only; deploy.sh seeds it once (docs/runbook.md).
      BUSINESS_ALLOW_SEED: "1"
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  client:
    logging: *logging
    mem_limit: 64m
    image: ghcr.io/michalwrzesinski/tabularius-client:${IMAGE_TAG:?}
    restart: unless-stopped
    networks: [internal]

  edge:
    logging: *logging
    mem_limit: 128m
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXY_PORT:?}:80"
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?}
      # Whole-environment protection until the public demo is approved (bcrypt, base64; deploy.sh generates it).
      STAGING_AUTH_USER: ${STAGING_AUTH_USER:?}
      STAGING_AUTH_HASH: ${STAGING_AUTH_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [internal]
    depends_on: [api, business, client]

networks:
  internal:
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:?}

volumes:
  db:
  reports:
