# Tabularius staging behind the host's nginx (shared host). Copy over the site file that serves the domain now,
# replace the domain and port if they differ, then: sudo nginx -t && sudo systemctl reload nginx (docs/runbook.md).
# The certificate is the one certbot already manages. Security headers come from the stack's own Caddy (edge).

server {
    listen 80;
    listen [::]:80;
    server_name tabularius.gitpush.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tabularius.gitpush.app;

    ssl_certificate /etc/letsencrypt/live/tabularius.gitpush.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabularius.gitpush.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The visitor's address, replaced (not appended): nothing a client sends in X-Forwarded-For is believed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
